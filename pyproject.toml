[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".test-core"]

[tool.ruff.lint]
select = ["F", "W", "E", "ASYNC", "C4", "Q", "I", "UP"]
ignore = ["E501", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["native_wakeup: integration test requiring AstrBot's native wakeup event queue"]

[tool.ruff.lint.isort]
known-third-party = ["astrbot"]
