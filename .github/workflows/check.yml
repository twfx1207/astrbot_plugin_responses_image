name: Check plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            core: v4.29.4
          - os: windows-latest
            core: v4.29.4
          - os: ubuntu-latest
            core: 6c942855cb06b6d43854e8b841859d60a5c6043e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.core }}
          path: .test-core
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install host and test dependencies
        run: python -m pip install ./.test-core -r requirements.txt -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          RESPONSES_IMAGE_TEST_CORE: ${{ github.workspace }}/.test-core
        run: python -m pytest -q
      - name: Build installation archive
        run: python scripts/build_release.py
      - name: Upload installation package
        if: matrix.os == 'ubuntu-latest' && matrix.core == 'v4.29.4'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-installation-package
          path: |
            dist/astrbot_plugin_responses_image-v*.zip
            dist/astrbot_plugin_responses_image-v*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
